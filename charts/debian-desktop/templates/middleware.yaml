{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "debian-desktop.fullname" . }}-oauth2-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "debian-desktop.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ tpl .Values.ingress.authUrl . | quote }}
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
{{- end }}
