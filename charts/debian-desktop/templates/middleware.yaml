{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "debian-desktop.fullname" . }}-oauth2-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "debian-desktop.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ tpl .Values.ingress.authUrl . | quote }}
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
# Error middleware: redirect unauthenticated requests to the oauth2-proxy
# sign-in page, NOT straight to /oauth2/start.
#
# Why: redirecting every unauthenticated request straight to /oauth2/start
# (added in v0.8.2) triggers a CSRF race. oauth2-proxy keeps a single
# `_oauth2_proxy_csrf` cookie, and every background request the desktop page
# auto-fetches while logged out (e.g. /sw.js, /favicon.ico - see also
# `ingress.skipAuthPaths`) gets its own /oauth2/start redirect that overwrites
# that cookie. By the time Google returns to /oauth2/callback, the state no
# longer matches the current cookie and login fails intermittently with
# "Unable to find a valid CSRF token" (403).
#
# The sign-in page only renders a login button and does not touch the CSRF
# cookie, so a single user-initiated login flow is the only thing that starts
# an OAuth flow.
#
# Note: no `statusRewrites` here. Rewriting 401 -> 302 would turn the 200
# sign-in page into a Location-less redirect that browsers can't follow.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "debian-desktop.fullname" . }}-oauth2-errors
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "debian-desktop.labels" . | nindent 4 }}
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy
      port: 80
    query: "/oauth2/sign_in?rd={url}"
{{- end }}
